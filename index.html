<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <button id="startButton">Start Game</button>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>
    <div>
        <p id="highScore">High score: 0</p>
        </p>
    </div>



    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
            const highScore = localStorage.getItem("highScore") || 0;
            if (score > highScore) {
                localStorage.setItem("highScore", score);
            }
            document.getElementById("highScore").textContent = "High score: " + highScore;
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

        //Movement
        // 
        const listenForStartButton = () => {
            const startButton = document.getElementById("startButton");
            startButton.addEventListener("click", () => {
                score = 0;
                document.getElementById("info").textContent = "Score: " + score;
                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                direction = { x: 1, y: 0 };
                placeFood();
                drawGame();
                setInterval(moveSnake, 150); 
            });
        };
        listenForStartButton();

        function moveSnake() {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById("info").textContent = "Score: " + score;
                placeFood();
            } else {
                snake.pop();
            }
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || snake.slice(1).some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
            }
            drawGame();
        }
        //setInterval(moveSnake, 150);   
        
        //Keyboard controls
        const keyboardHandler = (event) => {
            switch (event.key) {
                case "ArrowUp":
                    direction = { x: 0, y: -1 };
                    break;
                case "ArrowDown":
                    direction = { x: 0, y: 1 };
                    break;
                case "ArrowLeft":
                    direction = { x: -1, y: 0 };
                    break;
                case "ArrowRight":
                    direction = { x: 1, y: 0 };
                    break;
            }
        };
        document.addEventListener("keydown", keyboardHandler);

        //Placing the food after its eaten
        const placeFood = () => {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        };

        //Game over function
        const gameOver = () => {
            alert("Game Over! Your score: " + score);
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            score = 0;
            document.getElementById("info").textContent = "Score: " + score;
        };

    </script>

</body>
</html>
